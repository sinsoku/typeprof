name: Benchmark

# Measures the checked-out tree against the benchmark projects. Only pushes
# from master append to the published gh-pages history; every branch still
# gets the summary and alert comparison against the last published point.

on:
  push:

# Publishing runs must not race the append-only push to gh-pages; superseded
# runs on other branches are just cancelled.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write # auto-push to the gh-pages branch

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Measure
        run: ruby tool/benchmark.rb

      - name: Publish analysis time
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Analysis time'
          tool: 'customSmallerIsBetter'
          output-file-path: tmp/benchmark/analysis_time.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          summary-always: true
          # Shared runners vary by 10-20%; only flag clear regressions.
          alert-threshold: '150%'
          comment-on-alert: true

      - name: Publish type coverage
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Type coverage'
          tool: 'customBiggerIsBetter'
          output-file-path: tmp/benchmark/type_coverage.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          summary-always: true
          # Coverage is deterministic; flag even a half-percent drop.
          alert-threshold: '100.5%'
          comment-on-alert: true
