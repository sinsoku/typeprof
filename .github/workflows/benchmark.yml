name: Benchmark

on:
  push:

# Only pushes from master append to the published history; every branch still
# gets the summary and alert comparison against the last published point.
# The gh-pages history is append-only per run; concurrent runs would race the
# auto-push.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # auto-push to the gh-pages branch

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The benchmark measures the checked-out tree as-is, so a shallow
      # clone is enough.
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      # Writes tmp/benchmark/{speed,coverage}.json and fails the job when any
      # project does not analyse cleanly.
      - name: Measure
        run: ruby tool/benchmark.rb

      - name: Publish speed
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Analysis time'
          tool: 'customSmallerIsBetter'
          output-file-path: tmp/benchmark/speed.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          summary-always: true
          # Shared runners vary by 10-20%; only flag clear regressions.
          alert-threshold: '150%'
          comment-on-alert: true

      - name: Publish coverage
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Type coverage'
          tool: 'customBiggerIsBetter'
          output-file-path: tmp/benchmark/coverage.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          summary-always: true
          # Coverage is deterministic, so any real drop beyond rounding matters.
          alert-threshold: '101%'
          comment-on-alert: true
