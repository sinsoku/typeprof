name: Benchmark

# Only pushes from master append to the published gh-pages history; every
# branch still gets the summary and alert comparison against the last
# published point.

on:
  push:

# Publishing runs must not race the append-only push to gh-pages; superseded
# runs on other branches are just cancelled.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: write # auto-push to the gh-pages branch

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Measure
        run: ruby tool/benchmark.rb

      - name: Create gh-pages on the first run
        run: |
          if ! git ls-remote --exit-code origin gh-pages > /dev/null; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            commit=$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "Initialize the benchmark history")
            git push origin "${commit}:refs/heads/gh-pages"
          fi

      - name: Publish analysis time
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Analysis time'
          tool: 'customSmallerIsBetter'
          output-file-path: tmp/benchmark/analysis_time.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          summary-always: true
          # Shared runners vary by 10-20%; only flag clear regressions.
          alert-threshold: '150%'
          comment-on-alert: true

      - name: Publish type coverage
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: 'Type coverage'
          tool: 'customBiggerIsBetter'
          output-file-path: tmp/benchmark/type_coverage.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The step above commits to the local gh-pages; fetching again would be non-fast-forward.
          skip-fetch-gh-pages: true
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          summary-always: true
          alert-threshold: '100%'
          comment-on-alert: true
